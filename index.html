<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Ways to Complain</title>

</head>
<body>
    <main>
        <p class="eyebrow">A little help speaking up</p>
        <h1>Random Ways to Complain</h1>
        <p class="intro">Need a starting point? Get a simple, constructive way to raise a concern.</p>
        <button id="get-complaint" disabled>Show Me a Way to Complain</button>
        <div id="complaint" class="complaint-card" aria-live="polite" hidden></div>
    </main>
    
    <script>

        const getComplaint = document.getElementById("get-complaint");
        const complaint = document.getElementById("complaint");
        let complaintList = [];

        async function fetchComplaints() {

            const response = await fetch("complaints.json");
            if (!response.ok) {
                throw new Error("Could not load complaint suggestions.");
            }

            const data = await response.json();
            complaintList = data.complaints;
            getComplaint.disabled = false;

        }

        fetchComplaints().catch(function(error) {
            complaint.textContent = error.message;
            complaint.hidden = false;
        });

        getComplaint.addEventListener("click", function() {
            const randomIndex = Math.floor(Math.random() * complaintList.length);
            complaint.textContent = complaintList[randomIndex];
            complaint.hidden = false;
        });

    </script>

        <style>
        
        body {
            min-height: 100vh;
            margin: 0;
            padding: 2rem 1rem;
            display: grid;
            place-items: center;
            background: linear-gradient(145deg, #f8f5ff, #eef5ff);
            color: #24213a;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            width: min(100%, 38rem);
            padding: clamp(2rem, 7vw, 4rem);
            text-align: center;
            background: #ffffff;
            border: 1px solid #e8e4f2;
            border-radius: 1.5rem;
            box-shadow: 0 1.5rem 4rem rgb(50 39 85 / 12%);
        }

        .eyebrow {
            margin: 0 0 0.75rem;
            color: #7058b5;
            font-size: 0.78rem;
            font-weight: 750;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 6vw, 3rem);
            letter-spacing: -0.045em;
            line-height: 1.1;
        }

        .intro {
            max-width: 27rem;
            margin: 1rem auto 1.75rem;
            color: #686579;
            line-height: 1.6;
        }

        button {
            padding: 0.9rem 1.4rem;
            border: 0;
            border-radius: 0.75rem;
            background: #7058b5;
            color: #ffffff;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.6;
        }

        .complaint-card {
            margin-top: 1.75rem;
            padding: 1.5rem;
            border: 1px solid #e6defb;
            border-radius: 1rem;
            background: #f7f4ff;
            color: #382d59;
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.6;
        }

    </style>

</body>
</html>
